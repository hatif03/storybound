<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff7e6}
#root{width:100%;height:100%;position:relative;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#2b2140}
#title{position:absolute;left:140px;top:120px;font-size:84px;font-weight:700}
.row{position:absolute;left:140px;font-size:44px;font-weight:600}
.bar{position:absolute;left:140px;height:64px;border-radius:12px}
#claim{position:absolute;right:140px;top:140px;font-size:150px;font-weight:800;color:#2a7f62}
#claimlabel{position:absolute;right:140px;top:320px;font-size:36px;text-align:right;width:700px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <h1 id="title" class="clip" data-start="0" data-duration="8" data-track-index="0">Storybound keeps its promises</h1>
  <div id="claim" class="clip" data-start="1" data-duration="7" data-track-index="1">0/28</div>
  <div id="claimlabel" class="clip" data-start="1" data-duration="7" data-track-index="2">stories shipped broken, gated arm</div>
  <div class="row clip" style="top:460px" data-start="1.5" data-duration="6.5" data-track-index="3">Plain writer 27/28</div>
  <div class="bar clip" id="b0" style="top:530px;background:#c0504d;width:0" data-start="1.5" data-duration="6.5" data-track-index="4"></div>
  <div class="row clip" style="top:640px" data-start="2.0" data-duration="6" data-track-index="5">Self-review 27/28</div>
  <div class="bar clip" id="b2" style="top:710px;background:#c0504d;width:0" data-start="2.0" data-duration="6" data-track-index="6"></div>
  <div class="row clip" style="top:820px" data-start="2.5" data-duration="5.5" data-track-index="7">Gated 0/28</div>
  <div class="bar clip" id="b1" style="top:890px;background:#2a7f62;width:6px" data-start="2.5" data-duration="5.5" data-track-index="8"></div>
  <audio id="vo" data-start="0.3" data-duration="7" data-track-index="9" src="vo.mp3" data-volume="1"></audio>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.from("#title",{opacity:0,y:40,duration:.7},0)
  .from("#claim",{opacity:0,scale:.6,duration:.6},1)
  .to("#b0",{width:1500,duration:1.2},1.5)
  .to("#b2",{width:1500,duration:1.2},2.0)
  .to("#b1",{width:6,duration:.1},2.5);
window.__timelines["main"]=tl; tl.seek(0);
</script></body></html>
