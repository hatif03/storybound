[project]
name = "storybound"
version = "0.1.0"
description = "A storybook agent that writes an oath first and checks every page against it before a child sees it."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=0.2",
  "google-genai>=1.0",
  "openai>=1.40",
  "httpx>=0.27",
  "neatlogs>=1.4",
  "python-dotenv>=1.0",
  "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storybound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741"]  # the formatter wraps code; long prose strings and rubrics are fine
